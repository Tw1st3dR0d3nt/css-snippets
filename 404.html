<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0f0d">
  <meta name="description" content="The page you're looking for could not be found.">
  <title>404 — CSS Snippets</title>
  <link rel="stylesheet" href="/css-snippets/styles.css">

  <style>
    .error {
      min-height: calc(100vh - 72px);
      display: grid;
      place-items: center;
      text-align: center;
    }

    .error-inner {
      width: min(100%, 680px);
      padding: 80px 0;
    }

    .code404 {
      margin: 0;
      color: var(--accent);
      font: 800 clamp(6rem, 22vw, 12rem)/.8 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: -.09em;
    }

    .error h1 {
      margin: 34px 0 10px;
      font-size: clamp(2rem, 5vw, 3.4rem);
      letter-spacing: -.05em;
    }

    .error p:not(.code404) {
      margin: 0 auto 30px;
      max-width: 500px;
      color: var(--muted);
    }

    @media (max-width: 520px) {
      .error {
        min-height: calc(100vh - 64px);
      }

      .error-inner {
        padding: 60px 0;
      }
    }
  </style>

</head>

<body>
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="/css-snippets/">
        <span class="mark">&lt;/&gt;</span>
        <span>CSS Snippets</span>
      </a>

  <nav>
    <a href="/css-snippets/#snippets">Snippets</a>
    <a href="/css-snippets/#about">About</a>
    <a
      href="https://github.com/Tw1st3dR0d3nt/css-snippets"
      target="_blank"
      rel="noopener"
    >GitHub ↗</a>
  </nav>
</div>

  </header>

  <main class="error">
    <div class="container error-inner">
      <p class="code404">404</p>

  <h1>That page doesn't exist.</h1>

  <p>
    The page you're looking for couldn't be found. It may have been moved,
    renamed, or never existed.
  </p>

  <a class="button primary" href="/css-snippets/">
    Back to snippets <span>→</span>
  </a>
</div>

  </main>
</body>
</html>
